services:
  - type: web
    name: se7en-api
    runtime: node
    rootDir: backend/api
    buildCommand: npm ci && npm run build
    startCommand: npm run migration:run && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: se7en-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

databases:
  - name: se7en-db
    plan: free
